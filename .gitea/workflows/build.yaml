name: Deploy Playground & Publish Package (@gkucmierz/nano-ui)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    uses: gkucmierz/ci-workflows/.gitea/workflows/publish-package.yml@main
    with:
      runs_on: self-hosted-pl
      run_tests: true
      run_build: true
      publish_private: true
      publish_npmjs: true
      gitea_owner: 'gkucmierz'
      package_scope: '@gkucmierz'
    secrets: inherit

  deploy-playground:
    needs: publish
    uses: gkucmierz/ci-workflows/.gitea/workflows/zero-downtime-deploy.yml@main
    with:
      container_name: nano-ui
      runs_on: self-hosted-pl
      hot_swap_static: true
      wait_timeout_sec: 180
      healthcheck_url: 'https://nano.7u.pl/'
    secrets: inherit
