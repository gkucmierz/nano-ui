name: Build and Publish Nano UI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install dependencies and build
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Deploy Playground with Docker Compose
        run: |
          docker compose down --remove-orphans || true
          docker compose up -d --build

      # -------------- PUBLISH TO NPMJS.COM ----------------
      - name: Setup Node for npmjs.com
        uses: actions/setup-node@v3
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npmjs.com
        run: npm publish --access public || echo "Version already exists, skipping NPM publish."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      # -------------- PUBLISH TO GITEA.7U.PL --------------
      - name: Setup Node for gitea.7u.pl
        uses: actions/setup-node@v3
        with:
          registry-url: 'https://gitea.7u.pl/api/packages/gkucmierz/npm/'

      - name: Publish to gitea.7u.pl
        run: npm publish --registry=https://gitea.7u.pl/api/packages/gkucmierz/npm/ || echo "Version already exists, skipping Gitea publish."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LOCAL_PACKAGE_REGISTRY }}
