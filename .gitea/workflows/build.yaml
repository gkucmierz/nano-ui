name: Deploy Playground & Publish Package (@gkucmierz/nano-ui)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    uses: gkucmierz/ci-workflows/.gitea/workflows/publish-package.yml@main
    with:
      runs_on: self-hosted-pl
      run_tests: true
      run_build: true
      publish_private: true
      publish_npmjs: true
      gitea_owner: 'gkucmierz'
      package_scope: '@gkucmierz'
    secrets: inherit

  deploy-playground:
    needs: publish
    runs-on: self-hosted-pl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zero-downtime hot-swap deploy on PL server (topton)
        uses: gkucmierz/ci-workflows/zero-downtime-swap@main
        with:
          container_name: nano-ui
          hot_swap_static: 'true'
          wait_timeout_sec: '180'
          healthcheck_url: 'https://nano-ui.7u.pl/'
          private_registry_token: ${{ secrets.LOCAL_PACKAGE_REGISTRY || secrets.GITEA_TOKEN || github.token }}
