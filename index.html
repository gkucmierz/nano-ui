<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nano UI Playground</title>

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo-512.png" />

    <!-- Open Graph & Twitter Social Card Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nano UI" />
    <meta property="og:description" content="High-performance, minimal footprint Vue 3 UI library, interactive 3D charts, and kinematic components." />
    <meta property="og:image" content="/logo-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Nano UI" />
    <meta name="twitter:description" content="High-performance, minimal footprint Vue 3 UI library, interactive 3D charts, and kinematic components." />
    <meta name="twitter:image" content="/logo-512.png" />

    <!-- Synchronous Theme Initialization (Zero FOUC / Theme Flash) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('nano-ui-theme');
          var supportDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var t = (saved === 'light' || saved === 'dark') ? saved : (supportDark ? 'dark' : 'light');
          if (t === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
          document.documentElement.style.colorScheme = t;
          document.documentElement.classList.add('preload');
        } catch (e) {}
      })();
    </script>

    <style>
      /* Zero-FOUC: Default root background & browser engine declaration */
      html {
        background-color: #09090b;
        color-scheme: dark;
      }

      html[data-theme="light"] {
        background-color: #f8fafc;
        color-scheme: light;
      }

      /* Zero-FOUC: Freeze all CSS transitions during initial page load & dynamic theme switching */
      html.preload,
      html.preload *,
      html.preload *::before,
      html.preload *::after,
      html.theme-switching,
      html.theme-switching *,
      html.theme-switching *::before,
      html.theme-switching *::after {
        transition: none !important;
      }

      /* Universal Box-Sizing Reset */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/playground/main.js"></script>
  </body>
</html>
