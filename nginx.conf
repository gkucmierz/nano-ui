server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    # CSP: Minimal, strict scope allowing local assets, inline scripts/styles, and exact analytics endpoint (HTTPS + WSS)
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://analytics.7u.pl wss://analytics.7u.pl; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:;";

    # Enforce clean URLs & eliminate duplicate content: redirect trailing slashes with 301 Moved Permanently
    rewrite ^/(.+)/$ /$1 permanent;

    location / {
        try_files $uri $uri.html /index.html;
    }

    # Clean favicon fallback to prevent 404 console errors
    location = /favicon.ico {
        try_files /favicon.ico /nano-ui.svg =204;
        access_log off;
        log_not_found off;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
