<svg width="512" height="512" viewBox="0 0 260 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Glassmorphism Card Drop Shadow -->
    <filter id="nanoCardShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.09" />
    </filter>

    <!-- Core Ambient Radial Glow -->
    <radialGradient id="nanoBgGlow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.24" />
      <stop offset="55%" stop-color="#00f2fe" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Left & Right Vertical Stems Gradient -->
    <linearGradient id="stemGrad" x1="60" y1="50" x2="200" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Kinetic Diagonal Beam Gradient -->
    <linearGradient id="beamGrad" x1="70" y1="60" x2="190" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Light Squircle Base Canvas with Soft Shadow -->
  <rect x="8" y="8" width="244" height="244" rx="42" fill="#ffffff" stroke="rgba(15, 23, 42, 0.10)" stroke-width="1.5" filter="url(#nanoCardShadow)" />

  <!-- Ambient Glow Core -->
  <circle cx="130" cy="126" r="108" fill="url(#nanoBgGlow)" />

  <!-- High-Precision Reticle Rings -->
  <circle cx="130" cy="126" r="102" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1.2" stroke-dasharray="6 8" />
  <circle cx="130" cy="126" r="78" stroke="rgba(15, 23, 42, 0.05)" stroke-width="1" />

  <!-- Diagonal Alignment Axis -->
  <line x1="42" y1="38" x2="218" y2="214" stroke="rgba(15, 23, 42, 0.06)" stroke-width="1" stroke-dasharray="4 6" />

  <!-- BOLD KINETIC 'N' MONOGRAM (Continuous 34px Path) -->
  <!-- Left Vertical Stem -->
  <path
    d="M72 188 V64"
    stroke="url(#stemGrad)"
    stroke-width="34"
    stroke-linecap="round"
  />

  <!-- Diagonal Crossing Beam -->
  <path
    d="M72 64 L188 188"
    stroke="url(#beamGrad)"
    stroke-width="34"
    stroke-linecap="round"
  />

  <!-- Right Vertical Stem -->
  <path
    d="M188 188 V64"
    stroke="url(#stemGrad)"
    stroke-width="34"
    stroke-linecap="round"
  />

  <!-- Prominent Quantum Pulsar (Upper Right) -->
  <circle cx="188" cy="64" r="26" fill="rgba(0, 242, 254, 0.25)" />
  <circle cx="188" cy="64" r="15" fill="#00f2fe" />
  <circle cx="188" cy="64" r="6" fill="#ffffff" />

  <!-- Secondary Anchor Core (Bottom Left) -->
  <circle cx="72" cy="188" r="7" fill="#6366f1" />

  <!-- Subtitle Spec Text -->
  <text
    x="130"
    y="234"
    text-anchor="middle"
    font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="9.5"
    font-weight="700"
    letter-spacing="2"
    fill="#64748b"
  >
    NANO UI // QUANTUM 8PX
  </text>
</svg>
