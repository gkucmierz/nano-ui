<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Squircle Surface Gradient -->
    <linearGradient id="nanoBgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- [□] Golden Pillar Gradient (Indigo -> Electric Violet) -->
    <linearGradient id="nanoPhiRectDark" x1="112" y1="112" x2="180" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- [△] Golden Wedge Triangle Gradient (Indigo -> Emerald/Cyan) -->
    <linearGradient id="nanoPhiTriDark" x1="212" y1="112" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="55%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- [○] Quantum Sphere Radial Gradient (Cyan Core) -->
    <radialGradient id="nanoPhiCircleDark" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="45%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Canvas (Inset by 6px for stroke-width="12" -> [0, 0, 512, 512] zero clipping) -->
  <rect x="6" y="6" width="500" height="500" rx="140" fill="url(#nanoBgGradDark)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="12" />

  <!-- 1. [□] BAUHAUS GOLDEN PILLAR (H = 288, w = H * phi^-3 = 68) -->
  <rect x="112" y="112" width="68" height="288" rx="14.4" fill="url(#nanoPhiRectDark)" />

  <!-- 2. [△] BAUHAUS GOLDEN RIGHT TRIANGLE (Right leg = H * phi^-1 = 178 -> y = 400 - 178 = 222) -->
  <polygon points="212,112 400,400 400,222" fill="url(#nanoPhiTriDark)" />

  <!-- 3. [○] BAUHAUS GOLDEN SPHERE (Upper-right phi^-2 pocket, tangent to x=400, y=112) -->
  <circle cx="360.8" cy="151.2" r="39.2" fill="url(#nanoPhiCircleDark)" />
</svg>
