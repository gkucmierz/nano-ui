<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Light Squircle Gradient -->
    <linearGradient id="nanoBgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eef2ff" />
    </linearGradient>

    <!-- Ambient Core Radial Glow -->
    <radialGradient id="nanoAmbientGlowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Continuous Kinetic Energy Monogram Gradient (High-Contrast Light Mode) -->
    <linearGradient id="nanoKineticGradLight" x1="136" y1="376" x2="376" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3730a3" />
      <stop offset="32%" stop-color="#4f46e5" />
      <stop offset="68%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Canvas (Exact 1:1 Geometry with nano-ui-dark.svg) -->
  <rect x="6" y="6" width="500" height="500" rx="140" fill="url(#nanoBgGradLight)" stroke="rgba(79, 70, 229, 0.32)" stroke-width="12" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#nanoAmbientGlowLight)" />

  <!-- High-Precision Quantum Reticle Rings -->
  <circle cx="256" cy="256" r="208" stroke="rgba(15, 23, 42, 0.10)" stroke-width="2" stroke-dasharray="8 12" />
  <circle cx="256" cy="256" r="160" stroke="rgba(15, 23, 42, 0.06)" stroke-width="1.5" />

  <!-- Diagonal Alignment Axis -->
  <line x1="84" y1="84" x2="428" y2="428" stroke="rgba(15, 23, 42, 0.07)" stroke-width="1.5" stroke-dasharray="6 10" />

  <!-- BOLD KINETIC 'N' MONOGRAM (Continuous 72px Joined Path — Zero Pixel Shift vs Dark Icon) -->
  <path
    d="M136 376 V136 L376 376 V136"
    stroke="url(#nanoKineticGradLight)"
    stroke-width="72"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Prominent Quantum Pulsar (Upper Right) -->
  <circle cx="376" cy="136" r="54" fill="rgba(6, 182, 212, 0.24)" />
  <circle cx="376" cy="136" r="32" fill="#0284c7" />
  <circle cx="376" cy="136" r="13" fill="#ffffff" />

  <!-- Secondary Anchor Core (Bottom Left) -->
  <circle cx="136" cy="376" r="15" fill="#3730a3" />
</svg>
