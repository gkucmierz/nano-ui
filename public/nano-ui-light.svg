<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Light Squircle Surface Gradient -->
    <linearGradient id="nanoBgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eef2ff" />
    </linearGradient>

    <!-- [□] Golden Pillar Gradient (High-Contrast Deep Indigo) -->
    <linearGradient id="nanoPhiRectLight" x1="112" y1="112" x2="180" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <!-- [△] Golden Wedge Triangle Gradient (Indigo -> Deep Teal/Emerald) -->
    <linearGradient id="nanoPhiTriLight" x1="212" y1="112" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- [○] Quantum Sphere Radial Gradient (High-Contrast Cyan) -->
    <radialGradient id="nanoPhiCircleLight" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Canvas (Exact 1:1 Geometry with nano-ui-dark.svg) -->
  <rect x="6" y="6" width="500" height="500" rx="140" fill="url(#nanoBgGradLight)" stroke="rgba(79, 70, 229, 0.28)" stroke-width="12" />

  <!-- 1. [□] BAUHAUS GOLDEN PILLAR (H = 288, w = H * phi^-3 = 68) -->
  <rect x="112" y="112" width="68" height="288" rx="14.4" fill="url(#nanoPhiRectLight)" />

  <!-- 2. [△] BAUHAUS GOLDEN RIGHT TRIANGLE (Right leg = H * phi^-1 = 178 -> y = 400 - 178 = 222) -->
  <polygon points="212,112 400,400 400,222" fill="url(#nanoPhiTriLight)" />

  <!-- 3. [○] BAUHAUS GOLDEN SPHERE (Upper-right phi^-2 pocket, tangent to x=400, y=112) -->
  <circle cx="360.8" cy="151.2" r="39.2" fill="url(#nanoPhiCircleLight)" />
</svg>
